    <title>PassGuardian 🛡️ Crayon Comic Vault</title>

      Only Plus Jakarta Sans and IBM Plex Mono are actually referenced by
      any stylesheet in this project (see styles/crayon-comic.css and

    -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
