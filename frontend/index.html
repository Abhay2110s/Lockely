<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassGuardian 🛡️ Crayon Comic Vault</title>
    <!--
      Every family below is genuinely used — either directly (Plus Jakarta
      Sans, IBM Plex Mono) or through this project's custom utility classes
      in styles/crayon-comic.css (.ca-display, .ca-hand, .ca-mono,
      .font-heading-comic, .font-bangers, .font-sketch), which reference
      Anton/Bangers/Architects Daughter/Comic Neue/Fredoka/Space Mono as
      their primary typefaces. A prior pass here trimmed this list down to
      only the families found by grepping literal `font-family:` lines,
      which missed those class-based references — restored to the full set
      so headline text renders in its intended condensed display font
      instead of a much wider fallback.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Anton&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
